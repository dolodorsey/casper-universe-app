name: CASPER Customer Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  workflow_run:
    workflows: ['CASPER Customer Quality Gate']
    types: [completed]
    branches: [main]

concurrency:
  group: casper-customer-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run smoke:production
